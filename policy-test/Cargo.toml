[package]
name = "linkerd-policy-test"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = ["gateway-api-experimental", "gateway-api-tls-route-v1"]
# Enables tests for resources that are only available in the experimental
# channel of the Gateway API.
gateway-api-experimental = []
# Enables the TLSRoute tests, addressing TLSRoute as the named API version;
# leave both unset to skip them. TLSRoute has no version that is served by
# every supported Gateway API bundle: `v1alpha2` is the only version served by
# v1.2--v1.4 and by the CRDs vendored in the linkerd-crds chart, while `v1` is
# the only version served by the standard channel of v1.5.
gateway-api-tls-route-v1 = ["gateway-api-tls-route"]
gateway-api-tls-route-v1alpha2 = ["gateway-api-tls-route"]
# Implied by the features above; marks the TLSRoute tests as enabled, whichever
# version they address. Not meant to be enabled on its own.
gateway-api-tls-route = []

[dependencies]
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { workspace = true, features = ["client", "http2"] }
hyper-util = { workspace = true }
futures = { version = "0.3", default-features = false }
ipnet = "2"
k8s-openapi = { workspace = true }
maplit = "1"
prost-types = "0.14"
rand = "0.10"
serde = "1"
serde_json = "1"
schemars = "1"
tonic = { workspace = true }
tokio = { version = "1", features = ["macros", "rt"] }
tower = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

linkerd-policy-controller-core = { path = "../policy-controller/core" }
linkerd-policy-controller-k8s-api = { path = "../policy-controller/k8s/api" }
linkerd-policy-controller-grpc = { path = "../policy-controller/grpc" }

[dependencies.kube]
workspace = true
default-features = false
features = ["client", "rustls-tls", "aws-lc-rs", "runtime", "ws"]

[dependencies.linkerd2-proxy-api]
workspace = true
features = ["inbound", "outbound"]

[dev-dependencies]
tokio-test = "0.4"
regex = "1"
