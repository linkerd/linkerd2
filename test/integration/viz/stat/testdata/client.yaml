# Client side of the stat test's sample application: slow-cooker sends a
# steady stream of requests to backend-svc. The test applies this file only
# after the deployments in servers.yaml are ready, so slow-cooker starts
# sending immediately instead of sleeping first.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-cooker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow-cooker
  template:
    metadata:
      labels:
        app: slow-cooker
    spec:
      containers:
      - name: slow-cooker
        image: buoyantio/slow_cooker:1.3.0
        args:
        - http://backend-svc:8080
        ports:
        - containerPort: 9999
---
apiVersion: v1
kind: Service
metadata:
  name: slow-cooker
spec:
  selector:
    app: slow-cooker
  ports:
  - name: metrics
    port: 9999
    targetPort: 9999
