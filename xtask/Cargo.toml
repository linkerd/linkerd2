[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
futures = { version = "0.3", default-features = false }
k8s-openapi = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["time"] }

[dependencies.kube]
workspace = true
default-features = false
features = ["client", "rustls-tls", "aws-lc-rs", "runtime"]
