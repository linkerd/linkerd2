name: Stale

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stale:
    runs-on: ${{ vars.LINKERD2_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          debug-only: false
          enable-statistics: true
          operations-per-run: 128
          days-before-stale: 90
          days-before-close: 14
          stale-issue-label: wontfix
          stale-pr-label: wontfix
          exempt-issue-labels: pinned,area/security,area/tls,area/docs,area/test,good first issue,benchmarking,help wanted,epic,rfc,roadmap
          exempt-pr-labels: pinned,area/security,area/tls,area/docs,area/test,good first issue,benchmarking,help wanted,epic,rfc,roadmap
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            Thank you for your contributions.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            Thank you for your contributions.
